name: Measured product gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measured-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: measured-coverage-evidence-${{ github.sha }}
          path: evidence/coverage/
          if-no-files-found: error
          retention-days: 30

  blender-runtime:
    name: blender-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install declared Blender runtime
        run: |
          blender_archive="$RUNNER_TEMP/blender-5.2.0-linux-x64.tar.xz"
          blender_url="https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl libegl1 xz-utils
          curl --fail --silent --show-error --location "$blender_url" --output "$blender_archive"
          echo "96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  $blender_archive" | sha256sum --check --strict
          tar --extract --xz --file "$blender_archive" --directory "$RUNNER_TEMP"
          echo "BLENDER_PATH=$RUNNER_TEMP/blender-5.2.0-linux-x64/blender" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run Blender end-to-end and negative paths
        run: |
          started_at=$(date +%s%3N)
          pnpm vitest run tests/goldenManifest.integration.test.ts tests/sourceProjection.integration.test.ts tests/portableExport.integration.test.ts tests/lockedDeliveryPaths.integration.test.ts
          completed_at=$(date +%s%3N)
          blender_runtime_ms=$((completed_at - started_at))
          MEASURED_BLENDER_RUNTIME_MS="$blender_runtime_ms" pnpm benchmark:xray
      - name: Record exact execution identity
        if: always()
        run: |
          mkdir -p evidence
          node -e 'const fs=require("node:fs"); fs.writeFileSync("evidence/ci-runtime.json", JSON.stringify({schemaVersion:1, commit:process.env.GITHUB_SHA, runId:process.env.GITHUB_RUN_ID, runAttempt:process.env.GITHUB_RUN_ATTEMPT, runnerImage:process.env.ImageOS, node:process.version, pnpm:"10.33.0", blenderSource:"blender.org-5.2.0-linux-x64", blenderSha256:"96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48"}, null, 2)+"\n")'
          if [ -x "$BLENDER_PATH" ]; then "$BLENDER_PATH" --version > evidence/blender-version.txt; else echo "unavailable" > evidence/blender-version.txt; fi
      - name: Verify reproducible clean-install release
        run: pnpm release:verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: measured-runtime-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: measured-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
